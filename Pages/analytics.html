<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Analytics - 3D Project Management</title>

    <link rel="stylesheet" href="../css/analytics.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div class="page-layout">

        <div id="sidebar-container"></div>

        <div class="app">

            <header class="header">
                <div class="header-left">
                    <h1 class="title">Project Analytics</h1>
                    <p class="subtitle">Track progress across each act</p>
                </div>
            </header>

            <main class="content-area">

                <section class="analytics-card">

                    <div class="card-header">
                        <div>
                            <span class="card-label">OVERVIEW</span>
                            <h2>Project Progress</h2>
                        </div>
                    </div>

                    <div class="progress-list" id="progressList">
                        <!-- Progress rows are rendered here by analytics.js -->
                    </div>

                </section>

            </main>

        </div>

    </div>

    <script src="../jscode/sidebar.js"></script>
    <script src="../jscode/analytics.js"></script>

</body>
</html>
