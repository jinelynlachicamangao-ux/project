<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Out - 3D Project Management</title>

    <link rel="stylesheet" href="../css/logout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div class="logout-wrap">

        <div class="logout-card">

            <div class="logout-icon">
                <i class="fa-solid fa-right-from-bracket"></i>
            </div>

            <h1>Log out of your account?</h1>
            <p>You'll need to sign in again to access your projects and tasks.</p>

            <div class="logout-actions">
                <button class="secondary-btn" id="cancelLogoutBtn" type="button">Cancel</button>
                <button class="danger-btn" id="confirmLogoutBtn" type="button">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Log Out
                </button>
            </div>

        </div>

    </div>

    <script src="../jscode/logout.js"></script>

</body>
</html>
