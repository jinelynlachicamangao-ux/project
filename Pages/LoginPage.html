<!DOCTYPE html>
<html>
<head>
    <title>Log In</title>
    <link rel="stylesheet" type="text/css" href="../css/login-signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div class="background-blur"></div>

    <div class="login-box">
        <div class="login-header">
            <img src="../logo&icons/logo3dnew.png" alt="Logo" class="logo">
            <span class="close-btn" onclick="closeModal()">&times;</span>
        </div>

        <h1>Welcome!</h1>
        <h3>Login your account</h3>

        <form action="Dashboard.html" method="post">
            <input type="text" placeholder="Enter your email" required>

            <div class="input-with-icon">
                <input type="password" placeholder="Enter your password" required>
                <span class="icon-eye"><i class="fa-regular fa-eye"></i></span>
            </div>
            
            <p class="hint-text">Use 8 or more letters, numbers and symbols</p>

            <input type="submit" value="Continue">
        </form>

        <p class="divider">OR</p>

        <div class="social-buttons">
            <button><img src="../logo&icons/devicon--google.svg" alt="Google">Continue with Google</button>
            <button><img src="../logo&icons/logos--facebook.svg" alt="Facebook">Continue with Facebook</button>
        </div>

        <p class="return">You dont have an account? <a href="SignupPage.html">Signup</a></p>

        <div class="fine-print">
        
          <p class>
             By continuing, you agree to our
             <a href="#">Terms of Service</a> and acknowledge you've read our
             <a href="#">Privacy Policy</a>.
          </p>
        </div>

    </div>
    <script>
       function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.querySelector('.icon-eye i');
            const isPassword = pwd.type === 'password';
            pwd.type = isPassword ? 'text' : 'password';
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        }
 
        function closeModal() {
            window.parent.postMessage({ type: 'close-modal' }, '*');
        }
    </script>
</body>
</html>
