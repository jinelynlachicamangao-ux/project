<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../css/login-signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div class="signup-box">

        <!-- Header: logo + close button -->
        <div class="signup-header">
            <img src="../logo&icons/logo3dnew.png" alt="Logo" class="logo">
           <span class="close-btn" onclick="parent.document.getElementById('signup-modal').classList.remove('open')">&times;</span>

        </div>

        <h1>Create Account</h1>
        <h3>Manage tasks. Track progress. Get things done.</h3>

        <!-- Signup Form -->
        <form action="LoginPage.html" method="post">

            <input type="text" id="firstname" name="firstname" placeholder="First Name" required>

            <input type="text" id="lastname" name="lastname" placeholder="Last Name" required>

            <input type="text" id="email" name="email" placeholder="Email" required>

            <input type="text" placeholder="Enter your birthday (mm/dd/yyyy)">

            <div class="input-with-icon">
                <input type="password" placeholder="Enter your password" required>
                <span class="icon-eye"><i class="fa-regular fa-eye"></i></span>
            </div>
            <p class="hint-text">Must be at least 8 characters</p>

            <p>
                By clicking Sign Up, you agree to our <a href="#">Privacy Policy</a>
            </p>

            <input type="submit" value="Sign Up">
        </form>

        <!-- Social Login Divider -->
        <div class="divider">
            <span>or continue with</span>
        </div>

        <!-- Social Login Buttons -->
        <div class="social-buttons">
            <button type="button">
                <img src="../logo&icons/devicon--google.svg" alt="Google">
                Google
            </button>
            <button type="button">
                <img src="../logo&icons/akar-icons--github-fill.svg" alt="Facebook">
                GitHub
            </button>
        </div>

        <!-- Login Link -->
        <p>
            You already have an account?
            <a href="LoginPage.html">Login here</a>
        </p>

        <p class="fine-print">
            By continuing, you agree to our <a href="#">Terms of Service</a>.
        </p>
    </div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>

</html>
