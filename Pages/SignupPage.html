<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../css/login-signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div class="background-blur"></div>

    <div class="signup-box">

        <!-- Header: logo + close button -->
        <div class="signup-header">
            <div class="logo-wrapper">
                <img src="../logo&icons/logo3dnew.png" alt="Logo" class="logo">
            </div>
            <span class="close-btn" onclick="closeModal()">&times;</span>
        </div>

        <h1>Create Account</h1>
        <h3>Manage tasks. Track progress. Get things done.</h3>

        <!-- Signup Form -->
        <form id="signupForm">

            <input type="text" id="firstname" name="firstname" placeholder="First Name" required>

            <input type="text" id="lastname" name="lastname" placeholder="Last Name" required>

            <input type="text" id="email" name="email" placeholder="Email" required>

            <input type="text" id="birthday" name="birthday" placeholder="Enter your birthday (mm/dd/yyyy)">

            <div class="input-with-icon">
                <input type="password" id="password" name="password" class="password-field" placeholder="Enter your password" required>
                <span class="icon-eye" onclick="togglePassword()">
                    <i class="fa-regular fa-eye" id="eyeOpen"></i>
                    <i class="fa-regular fa-eye-slash" id="eyeClosed" style="display:none;"></i>
                </span>
            </div>
            <p class="hint-text">Must be at least 8 characters</p>

            <p>
                By clicking Sign Up, you agree to our <a href="#">Privacy Policy</a>
            </p>

            <input type="submit" value="Sign Up">
        </form>

        <!-- Social Login Divider -->
        <div class="divider">
            <span>or continue with</span>
        </div>

        <!-- Social Login Buttons -->
        <div class="social-buttons">
            <button type="button">
                <img src="../logo&icons/devicon--google.svg" alt="Google">
                Google
            </button>
            <button type="button">
                <img src="../logo&icons/akar-icons--github-fill.svg" alt="GitHub">
                GitHub
            </button>
        </div>

        <!-- Login Link -->
        <p>
            You already have an account?
            <a href="LoginPage.html">Login here</a>
        </p>

        <p class="fine-print">
            By continuing, you agree to our <a href="#">Terms of Service</a>.
        </p>
    </div>

    <script>
        // Show/hide the password, and swap the eye icon to match
        function togglePassword() {
            const pwd = document.getElementById('password');
            const eyeOpen = document.getElementById('eyeOpen');
            const eyeClosed = document.getElementById('eyeClosed');
            const isHidden = pwd.type === 'password';

            pwd.type = isHidden ? 'text' : 'password';

            eyeOpen.style.display = isHidden ? 'none' : 'block';
            eyeClosed.style.display = isHidden ? 'block' : 'none';
        }

        // Close the modal via the parent homepage
        function closeModal() {
            try {
                parent.postMessage({ type: 'close-modal' }, '*');
            } catch (e) {
                // no-op if parent isn't listening
            }
        }

        // Handle the signup submit
        document.getElementById('signupForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const password = document.getElementById('password').value;

            if (password.length < 8) {
                alert('Password must be at least 8 characters.');
                return;
            }

            // TODO: replace this with a real API call to create the account.

            try {
                parent.postMessage({
                    type: 'signup-complete',
                    destination: 'Dashboard.html'
                }, '*');
            } catch (err) {
                window.location.href = 'Dashboard.html';
            }
        });
    </script>
</body>

</html>
