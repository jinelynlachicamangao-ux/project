<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Kanban</title>

    <link rel="stylesheet" href="../css/kanban.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div class="page-layout">

        <div id="sidebar-container"></div>

        <div class="app">

            <header class="header">

                <div class="header-left">
                    <button class="return-btn" id="returnBtn" type="button" aria-label="Return to projects">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>

                    <div>
                        <h1 class="title" id="projectTitle">Project Kanban</h1>
                        <p class="subtitle">Board view for this project</p>
                    </div>
                </div>

                <div class="header-actions">

                    <button class="invite-btn" id="inviteBtn" type="button">
                        <i class="fa-solid fa-user-plus"></i>
                        Invite
                    </button>

                    <button class="add-btn" id="addBtn" type="button">
                        <i class="fa-solid fa-plus"></i>
                        New Task
                    </button>

                </div>

            </header>

            <div class="members-row" id="membersRow"></div>

            <main class="board" id="board">

                <section class="column" data-status="todo">
                    <div class="column-header">
                        <div class="column-title-wrap">
                            <span class="dot todo"></span>
                            <h2>To Do</h2>
                        </div>
                        <span class="count" data-count="todo">0</span>
                    </div>
                    <div class="cards" id="todoList"></div>
                </section>

                <section class="column" data-status="doing">
                    <div class="column-header">
                        <div class="column-title-wrap">
                            <span class="dot doing"></span>
                            <h2>In Progress</h2>
                        </div>
                        <span class="count" data-count="doing">0</span>
                    </div>
                    <div class="cards" id="doingList"></div>
                </section>

                <section class="column" data-status="done">
                    <div class="column-header">
                        <div class="column-title-wrap">
                            <span class="dot done"></span>
                            <h2>Done</h2>
                        </div>
                        <span class="count" data-count="done">0</span>
                    </div>
                    <div class="cards" id="doneList"></div>
                </section>

            </main>

        </div>

    </div>

    <!-- TASK MODAL -->

    <div class="modal" id="taskModal" aria-hidden="true">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="taskTitleLabel">

            <div class="modal-header">
                <div>
                    <span class="modal-label">TASK</span>
                    <h3 id="taskTitleLabel">Create a task</h3>
                </div>
                <button type="button" class="modal-close" id="closeModalBtn" aria-label="Close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="taskForm">

                <div class="form-group">
                    <label for="taskTitleInput">Title</label>
                    <input id="taskTitleInput" type="text" maxlength="60" placeholder="Task title" required>
                </div>

                <div class="form-group">
                    <label for="taskDescInput">Description</label>
                    <textarea id="taskDescInput" maxlength="220" placeholder="Add details..."></textarea>
                </div>

                <div class="form-group">
                    <label for="taskStatusInput">Status</label>
                    <select id="taskStatusInput">
                        <option value="todo">To Do</option>
                        <option value="doing">In Progress</option>
                        <option value="done">Done</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="secondary-btn" id="cancelBtn">Cancel</button>
                    <button type="submit" class="primary-btn">
                        <i class="fa-solid fa-check"></i>
                        Save Task
                    </button>
                </div>

            </form>

        </div>
    </div>

    <!-- INVITE MODAL -->

    <div class="modal" id="inviteModal" aria-hidden="true">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="inviteTitleLabel">

            <div class="modal-header">
                <div>
                    <span class="modal-label">TEAM</span>
                    <h3 id="inviteTitleLabel">Invite a member</h3>
                </div>
                <button type="button" class="modal-close" id="closeInviteModalBtn" aria-label="Close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="inviteForm">

                <div class="form-group">
                    <label for="inviteEmailInput">Email address</label>
                    <input id="inviteEmailInput" type="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="inviteRoleInput">Role</label>
                    <select id="inviteRoleInput">
                        <option value="editor">Editor</option>
                        <option value="viewer">Viewer</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="secondary-btn" id="cancelInviteBtn">Cancel</button>
                    <button type="submit" class="primary-btn">
                        <i class="fa-solid fa-paper-plane"></i>
                        Send Invite
                    </button>
                </div>

            </form>

        </div>
    </div>

    <script src="../jscode/sidebar.js"></script>
    <script src="../jscode/kanban.js"></script>

</body>
</html>
