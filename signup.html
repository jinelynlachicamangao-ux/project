<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <link rel="stylesheet" type="text/css" href="signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div class="background-blur"></div>

    <div class="signup-box">
        <div class="signup-header">
         
                <img src="logo3d.png" alt="Logo" class="logo">
           
            <span class="close-btn">&times;</span>
        </div>

        <h1>Welcome!</h1>
        <h3>Join us for free to get started</h3>

        <form method="post">
            <input type="text" placeholder="Enter your email" required>

            <div class="input-with-icon">
                <input type="password" placeholder="Create a password" required>
                <span class="icon-eye"><i class="fa-regular fa-eye"></i></span>
            </div>
            <p class="hint-text">Use 8 or more letters, numbers and symbols</p>

            <input type="text" placeholder="Enter your birthday (mm/dd/yyyy)">

            <input type="submit" value="Continue">
        </form>

        <p class="divider">OR</p>

        <div class="social-buttons">
            <button><img src="devicon--google.svg" alt="Google">Continue with Google</button>
            <button><img src="logos--facebook.svg" alt="Facebook">Continue with Facebook</button>
        </div>

        <p>Already have an account? <a href="login.html">Log in</a></p>

        <p class="fine-print">
            By continuing, you agree to our
            <a href="#">Terms of Service</a> and acknowledge you've read our
            <a href="#">Privacy Policy</a>.
        </p>
    </div>
</body>
</html>
