<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css">
</head>

<body>
    <div class="background-blur"></div>

    <div class="login-box">
   
        <img src="logo3d.png" alt="Logo" class="logo">
    

    <h1>Welcome to 3D!</h1>
    <h3>Drag, Drop and Done</h3>

    <form method="">
        <input type="text" placeholder="Email Address" required> <br><br>
        <input type="password" placeholder="Password" required> <br><br>

        <div class="options">
            <label class="remember-me">
                <input type="checkbox">
                Remember me
            </label>
            <a href="#">Forgot password?</a>
        </div>

        <input type="submit" value="Login">
    </form>

    <p>─────────────&nbsp; or continue with &nbsp;─────────────</p>

    <div class="social-buttons">
        <button><img src="devicon--google.svg" alt="Google">Google</button>
        <button><img src="logos--facebook.svg" alt="Facebook">Facebook</button>
    </div>

    <p class="register-line">
        Don't have an account?
        <a href="#">Sign up</a>
    </p>
    <p class="legal-line">
        <a href="#">Terms of Service</a> and
        <a href="#">Privacy Policy</a>.
    </p>
        
</div>
</body>
</html>
